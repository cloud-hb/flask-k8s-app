apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  selector:
    app: flask-app
  ports:
    - name: http
      protocol: TCP  # Flask serves HTTP over TCP.
      port: 80       # Service port.
      targetPort: 8080  # Flask container port.

  # Choose one:
  # Option A: Local access with kubectl port-forward.
  # type: ClusterIP
  #
  # Option B: External access through a supported cloud load balancer.
  # type: LoadBalancer
  type: LoadBalancer

